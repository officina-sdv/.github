<title id="t">officina-showroom reference cockpit</title><desc id="d">X-Verse feeds the Android Automotive cluster over gRPC and the radar ECU on QNX over SOME/IP. The freshness gateway on QNX returns the warning level, or radar unavailable, to the cluster.</desc>
